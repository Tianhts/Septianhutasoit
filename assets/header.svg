<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="170" viewBox="0 0 1000 170" role="img" aria-label="Septian Hutasoit - Software Engineer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0%" stop-color="#06222b">
        <animate attributeName="stop-color" dur="16s" repeatCount="indefinite"
          values="#06222b;#0a1a3d;#1f0f3d;#3b0a26;#06222b" />
      </stop>
      <stop offset="55%" stop-color="#0b1220">
        <animate attributeName="stop-color" dur="16s" repeatCount="indefinite"
          values="#0b1220;#0b1220;#12091f;#1a0a14;#0b1220" />
      </stop>
      <stop offset="100%" stop-color="#00a3c4">
        <animate attributeName="stop-color" dur="16s" repeatCount="indefinite"
          values="#00a3c4;#2563eb;#9333ea;#db2777;#00a3c4" />
      </stop>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="170" fill="url(#bg)" />
  <rect width="1000" height="170" fill="url(#glow)">
    <animateTransform attributeName="transform" type="translate" from="-1000 0" to="1000 0" dur="9s" repeatCount="indefinite" />
  </rect>

  <!-- Twinkling dots -->
  <g fill="#ffffff">
    <circle cx="90" cy="50" r="2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3s" repeatCount="indefinite" /></circle>
    <circle cx="210" cy="70" r="1.5"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="4s" repeatCount="indefinite" /></circle>
    <circle cx="340" cy="40" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="5s" repeatCount="indefinite" /></circle>
    <circle cx="640" cy="35" r="1.5"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.5s" repeatCount="indefinite" /></circle>
    <circle cx="780" cy="60" r="2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="4.5s" repeatCount="indefinite" /></circle>
    <circle cx="910" cy="45" r="1.5"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="3.2s" repeatCount="indefinite" /></circle>
    <circle cx="150" cy="95" r="1.5"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="6s" repeatCount="indefinite" /></circle>
    <circle cx="870" cy="85" r="1.5"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="5.5s" repeatCount="indefinite" /></circle>
  </g>

  <!-- Title -->
  <g text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#ffffff">
    <text x="500" y="62" font-size="40" font-weight="700" opacity="0">
      Septian Hutasoit
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" dur="1.2s" fill="freeze" />
    </text>
    <text x="500" y="92" font-size="16" font-weight="600" opacity="0">
      Software Engineer | Backend | Fullstack | DevOps &amp; AI/ML
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="0.5s" fill="freeze" />
    </text>
    <text x="500" y="114" font-size="12" opacity="0">
      Building robust web apps &#183; Exploring AI
      <animate attributeName="opacity" from="0" to="0.8" dur="1.2s" begin="1s" fill="freeze" />
    </text>
  </g>

  <!-- Waves (moving) -->
  <g transform="translate(0,100)">
    <path d="M0 40 Q250 0 500 40 T1000 40 T1500 40 T2000 40 V100 H0 Z" fill="#0d1117" fill-opacity="0.35">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="14s" repeatCount="indefinite" />
    </path>
    <path d="M0 50 Q250 85 500 50 T1000 50 T1500 50 T2000 50 V100 H0 Z" fill="#0d1117" fill-opacity="0.6">
      <animateTransform attributeName="transform" type="translate" from="-1000 0" to="0 0" dur="10s" repeatCount="indefinite" />
    </path>
    <path d="M0 62 Q250 30 500 62 T1000 62 T1500 62 T2000 62 V100 H0 Z" fill="#0d1117">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="7s" repeatCount="indefinite" />
    </path>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
